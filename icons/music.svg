<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="music-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="30%" style="stop-color:#f97316"/>
      <stop offset="70%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="music-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.8)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="music-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Liquid blob background -->
  <path d="M6 20 Q2 12 12 8 Q24 4 36 8 Q46 12 42 20 Q46 32 36 40 Q24 46 12 40 Q2 32 6 20Z" fill="url(#music-bg)" filter="url(#music-glow)"/>
  <!-- Inner glow -->
  <ellipse cx="20" cy="18" rx="12" ry="8" fill="url(#music-shine)" opacity="0.5"/>
  <!-- Music note -->
  <path d="M20 32 L20 16 L32 14 L32 28" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="17" cy="32" r="4" fill="white"/>
  <circle cx="29" cy="28" r="4" fill="white"/>
  <!-- Visualizer bars -->
  <rect x="8" y="26" width="2" height="8" rx="1" fill="rgba(255,255,255,0.6)"/>
  <rect x="12" y="22" width="2" height="12" rx="1" fill="rgba(255,255,255,0.5)"/>
  <rect x="36" y="24" width="2" height="10" rx="1" fill="rgba(255,255,255,0.5)"/>
  <rect x="40" y="28" width="2" height="6" rx="1" fill="rgba(255,255,255,0.4)"/>
  <!-- Sparkles -->
  <circle cx="42" cy="10" r="2" fill="white" opacity="0.9"/>
  <circle cx="6" cy="36" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="38" cy="38" r="1" fill="white" opacity="0.6"/>
</svg>