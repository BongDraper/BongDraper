<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="musicCD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8"/>
      <stop offset="25%" style="stop-color:#C0C0C0"/>
      <stop offset="50%" style="stop-color:#E8E8E8"/>
      <stop offset="75%" style="stop-color:#A0A0A0"/>
      <stop offset="100%" style="stop-color:#C0C0C0"/>
    </linearGradient>
    <linearGradient id="musicRainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="25%" style="stop-color:#4ECDC4"/>
      <stop offset="50%" style="stop-color:#45B7D1"/>
      <stop offset="75%" style="stop-color:#96E6A1"/>
      <stop offset="100%" style="stop-color:#DDA0DD"/>
    </linearGradient>
    <linearGradient id="musicNote" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333333"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <filter id="musicShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- CD disc -->
  <circle cx="32" cy="32" r="28" fill="url(#musicCD)" filter="url(#musicShadow)"/>
  <!-- Rainbow reflection rings -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#musicRainbow)" stroke-width="2" opacity="0.5"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#musicRainbow)" stroke-width="1" opacity="0.4"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#musicRainbow)" stroke-width="1" opacity="0.3"/>
  <!-- Center hole -->
  <circle cx="32" cy="32" r="6" fill="#333"/>
  <circle cx="32" cy="32" r="4" fill="#666"/>
  <circle cx="32" cy="32" r="2" fill="#999"/>
  <!-- Music note overlay -->
  <g transform="translate(20, 14)">
    <ellipse cx="8" cy="28" rx="6" ry="4" fill="url(#musicNote)" transform="rotate(-20 8 28)"/>
    <ellipse cx="20" cy="24" rx="6" ry="4" fill="url(#musicNote)" transform="rotate(-20 20 24)"/>
    <rect x="12" y="6" width="3" height="22" fill="url(#musicNote)"/>
    <rect x="24" y="2" width="3" height="22" fill="url(#musicNote)"/>
    <path d="M12 6 Q18 2 27 2 L27 8 Q18 8 15 12" fill="url(#musicNote)"/>
  </g>
  <!-- Glossy highlight -->
  <ellipse cx="24" cy="20" rx="12" ry="8" fill="rgba(255,255,255,0.3)"/>
</svg>