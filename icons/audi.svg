<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="audi-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="50%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
    <linearGradient id="audi-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="8" fill="url(#audi-bg)"/>
  <rect x="4" y="4" width="40" height="20" rx="8" fill="url(#audi-shine)"/>
  <!-- Four rings -->
  <circle cx="14" cy="24" r="5" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="21" cy="24" r="5" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="28" cy="24" r="5" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="35" cy="24" r="5" fill="none" stroke="white" stroke-width="2"/>
</svg>