<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="audi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b"/>
      <stop offset="50%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="audi-chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="40%" style="stop-color:#cbd5e1"/>
      <stop offset="60%" style="stop-color:#94a3b8"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <filter id="audi-glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background blob -->
  <ellipse cx="24" cy="24" rx="20" ry="16" fill="url(#audi-bg)" filter="url(#audi-glow)"/>
  <!-- Four rings -->
  <circle cx="12" cy="24" r="6" fill="none" stroke="url(#audi-chrome)" stroke-width="2"/>
  <circle cx="20" cy="24" r="6" fill="none" stroke="url(#audi-chrome)" stroke-width="2"/>
  <circle cx="28" cy="24" r="6" fill="none" stroke="url(#audi-chrome)" stroke-width="2"/>
  <circle cx="36" cy="24" r="6" fill="none" stroke="url(#audi-chrome)" stroke-width="2"/>
  <!-- Sparkles -->
  <circle cx="40" cy="12" r="2" fill="white" opacity="0.9"/>
  <circle cx="8" cy="34" r="1.5" fill="white" opacity="0.7"/>
</svg>