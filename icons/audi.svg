<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="audiChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#A0A0A0"/>
      <stop offset="100%" style="stop-color:#606060"/>
    </linearGradient>
    <filter id="audiShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="#1a1a1a" filter="url(#audiShadow)"/>
  <circle cx="32" cy="32" r="26" fill="#2a2a2a"/>
  <!-- Audi rings -->
  <g fill="none" stroke="url(#audiChrome)" stroke-width="3" filter="url(#innerGlow)">
    <circle cx="14" cy="32" r="10"/>
    <circle cx="24" cy="32" r="10"/>
    <circle cx="40" cy="32" r="10"/>
    <circle cx="50" cy="32" r="10"/>
  </g>
  <!-- Highlight on rings -->
  <g fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1">
    <path d="M6 28 A10 10 0 0 1 14 22"/>
    <path d="M16 28 A10 10 0 0 1 24 22"/>
    <path d="M32 28 A10 10 0 0 1 40 22"/>
    <path d="M42 28 A10 10 0 0 1 50 22"/>
  </g>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
</svg>