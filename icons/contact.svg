<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="contact-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="contact-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.7)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="contact-glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Envelope blob -->
  <path d="M6 14 Q4 12 8 10 L40 10 Q44 12 42 14 L42 36 Q44 40 40 38 L8 38 Q4 40 6 36Z" fill="url(#contact-bg)" filter="url(#contact-glow)"/>
  <!-- Envelope flap -->
  <path d="M6 14 L24 26 L42 14" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none"/>
  <!-- Shine -->
  <path d="M8 12 L20 12 L12 20Z" fill="url(#contact-shine)" opacity="0.4"/>
  <!-- Paper peeking out -->
  <rect x="12" y="22" width="24" height="12" rx="1" fill="white" opacity="0.3"/>
  <!-- Sparkles -->
  <circle cx="42" cy="8" r="2" fill="white" opacity="0.9"/>
  <circle cx="4" cy="34" r="1.5" fill="white" opacity="0.7"/>
  <!-- Star sticker -->
  <polygon points="40 32 41 35 44 35 42 37 43 40 40 38 37 40 38 37 36 35 39 35" fill="#fde047"/>
</svg>