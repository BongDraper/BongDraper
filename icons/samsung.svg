<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="samsungBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A4A4A"/>
      <stop offset="30%" style="stop-color:#2A2A2A"/>
      <stop offset="70%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#0A0A0A"/>
    </linearGradient>
    <linearGradient id="samsungScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B68EE"/>
      <stop offset="50%" style="stop-color:#6A5ACD"/>
      <stop offset="100%" style="stop-color:#483D8B"/>
    </linearGradient>
    <linearGradient id="samsungGloss" x1="0%" y1="0%" x2="0%" y2="40%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.5)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="samsungShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Phone body -->
  <rect x="12" y="2" width="40" height="60" rx="5" fill="url(#samsungBody)" filter="url(#samsungShadow)"/>
  <!-- Metal frame -->
  <rect x="13" y="3" width="38" height="58" rx="4" fill="none" stroke="#666" stroke-width="1"/>
  <!-- Screen -->
  <rect x="14" y="6" width="36" height="52" rx="3" fill="url(#samsungScreen)"/>
  <!-- AI sparkle icon -->
  <g fill="white">
    <polygon points="32,16 34,24 42,26 34,28 32,36 30,28 22,26 30,24" opacity="0.9"/>
    <polygon points="24,32 25,36 29,37 25,38 24,42 23,38 19,37 23,36" opacity="0.7"/>
    <polygon points="40,32 41,36 45,37 41,38 40,42 39,38 35,37 39,36" opacity="0.7"/>
  </g>
  <!-- Galaxy S24 text -->
  <text x="32" y="50" fill="rgba(255,255,255,0.8)" font-size="5" font-family="Arial" text-anchor="middle" font-weight="bold">GALAXY S24</text>
  <!-- Glossy overlay -->
  <rect x="14" y="6" width="36" height="20" rx="3" fill="url(#samsungGloss)"/>
  <!-- Camera -->
  <circle cx="32" cy="4" r="1.5" fill="#333"/>
</svg>