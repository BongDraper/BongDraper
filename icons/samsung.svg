<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="sam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3fc"/>
      <stop offset="50%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="sam-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.8)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <filter id="sam-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Phone body -->
  <rect x="12" y="4" width="24" height="40" rx="4" fill="url(#sam-bg)" filter="url(#sam-glow)"/>
  <!-- Screen -->
  <rect x="14" y="8" width="20" height="30" rx="2" fill="url(#screen)"/>
  <!-- Screen shine -->
  <rect x="14" y="8" width="20" height="12" rx="2" fill="url(#sam-shine)" opacity="0.3"/>
  <!-- Camera dot -->
  <circle cx="24" cy="6" r="1.5" fill="#333"/>
  <!-- Wallpaper gradient on screen -->
  <rect x="15" y="9" width="18" height="28" rx="1" fill="url(#sam-bg)" opacity="0.4"/>
  <!-- Sparkles -->
  <circle cx="38" cy="10" r="2" fill="white" opacity="0.9"/>
  <circle cx="40" cy="8" r="1" fill="white" opacity="0.6"/>
  <circle cx="10" cy="38" r="1.5" fill="white" opacity="0.7"/>
</svg>