<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="shib-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="30%" style="stop-color:#c084fc"/>
      <stop offset="70%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="shib-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shib-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Globe/portal blob -->
  <circle cx="24" cy="24" r="18" fill="url(#shib-bg)" filter="url(#shib-glow)"/>
  <!-- Shine -->
  <ellipse cx="20" cy="18" rx="10" ry="8" fill="url(#shib-shine)" opacity="0.6"/>
  <!-- Grid lines for virtual world feel -->
  <path d="M10 24 Q24 20 38 24" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none"/>
  <path d="M12 30 Q24 26 36 30" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none"/>
  <path d="M24 10 L24 38" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <path d="M16 12 L16 36" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <path d="M32 12 L32 36" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Sparkles -->
  <circle cx="38" cy="12" r="2" fill="white" opacity="0.9"/>
  <circle cx="8" cy="32" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="40" cy="28" r="1" fill="white" opacity="0.6"/>
</svg>