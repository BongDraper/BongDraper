<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="shibuya-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9966"/>
      <stop offset="50%" style="stop-color:#ff5e62"/>
      <stop offset="100%" style="stop-color:#d93654"/>
    </linearGradient>
    <linearGradient id="shibuya-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.5)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="8" fill="url(#shibuya-bg)"/>
  <rect x="4" y="4" width="40" height="20" rx="8" fill="url(#shibuya-shine)"/>
  <!-- Torii gate simplified -->
  <rect x="14" y="28" width="3" height="12" fill="white"/>
  <rect x="31" y="28" width="3" height="12" fill="white"/>
  <rect x="12" y="24" width="24" height="3" fill="white"/>
  <rect x="10" y="20" width="28" height="3" fill="white"/>
</svg>