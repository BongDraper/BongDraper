<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shibuyaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>
    <linearGradient id="shibuyaNeon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF"/>
      <stop offset="100%" style="stop-color:#0080FF"/>
    </linearGradient>
    <linearGradient id="shibuyaPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF69B4"/>
      <stop offset="100%" style="stop-color:#FF1493"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shibuyaShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="4" y="4" width="56" height="56" rx="8" fill="url(#shibuyaSky)" filter="url(#shibuyaShadow)"/>
  <!-- Buildings silhouette -->
  <rect x="8" y="30" width="8" height="26" fill="#1a1a2e"/>
  <rect x="18" y="24" width="10" height="32" fill="#1a1a2e"/>
  <rect x="30" y="28" width="8" height="28" fill="#1a1a2e"/>
  <rect x="40" y="22" width="12" height="34" fill="#1a1a2e"/>
  <!-- Neon signs -->
  <g filter="url(#neonGlow)">
    <rect x="10" y="34" width="4" height="6" fill="url(#shibuyaNeon)" opacity="0.9"/>
    <rect x="20" y="28" width="6" height="4" fill="url(#shibuyaPink)" opacity="0.9"/>
    <rect x="32" y="32" width="4" height="8" fill="url(#shibuyaNeon)" opacity="0.9"/>
    <rect x="44" y="26" width="6" height="4" fill="url(#shibuyaPink)" opacity="0.9"/>
    <rect x="42" y="34" width="8" height="3" fill="url(#shibuyaNeon)" opacity="0.9"/>
  </g>
  <!-- Crossing lines -->
  <line x1="4" y1="56" x2="60" y2="56" stroke="url(#shibuyaNeon)" stroke-width="2" filter="url(#neonGlow)"/>
  <!-- VR indicator -->
  <circle cx="32" cy="14" r="6" fill="none" stroke="url(#shibuyaPink)" stroke-width="2" filter="url(#neonGlow)"/>
  <text x="32" y="17" fill="white" font-size="6" text-anchor="middle" font-weight="bold">VR</text>
  <!-- Stars -->
  <circle cx="12" cy="12" r="1" fill="white" opacity="0.8"/>
  <circle cx="50" cy="10" r="1" fill="white" opacity="0.6"/>
  <circle cx="28" cy="8" r="0.8" fill="white" opacity="0.7"/>
</svg>