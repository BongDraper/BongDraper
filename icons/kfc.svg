<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="kfcRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5252"/>
      <stop offset="30%" style="stop-color:#E53935"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    <linearGradient id="kfcBucket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#F5F5F5"/>
      <stop offset="100%" style="stop-color:#E0E0E0"/>
    </linearGradient>
    <linearGradient id="kfcChicken" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D"/>
      <stop offset="50%" style="stop-color:#F57C00"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
    <filter id="kfcShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Bucket -->
  <path d="M12 28 L16 56 Q18 60 32 60 Q46 60 48 56 L52 28 Z" fill="url(#kfcBucket)" filter="url(#kfcShadow)"/>
  <!-- Red stripe -->
  <path d="M14 36 L17 54 Q18 56 32 56 Q46 56 47 54 L50 36 Z" fill="url(#kfcRed)"/>
  <!-- Bucket rim -->
  <ellipse cx="32" cy="28" rx="20" ry="6" fill="url(#kfcBucket)"/>
  <ellipse cx="32" cy="28" rx="18" ry="5" fill="#E8E8E8"/>
  <!-- Chicken pieces sticking out -->
  <ellipse cx="24" cy="22" rx="8" ry="6" fill="url(#kfcChicken)" transform="rotate(-15 24 22)"/>
  <ellipse cx="40" cy="20" rx="9" ry="5" fill="url(#kfcChicken)" transform="rotate(20 40 20)"/>
  <ellipse cx="32" cy="18" rx="7" ry="5" fill="url(#kfcChicken)"/>
  <!-- Crispy texture dots -->
  <g fill="#D84315" opacity="0.6">
    <circle cx="22" cy="20" r="1"/>
    <circle cx="26" cy="24" r="0.8"/>
    <circle cx="38" cy="18" r="1"/>
    <circle cx="42" cy="22" r="0.8"/>
    <circle cx="30" cy="16" r="0.8"/>
    <circle cx="34" cy="19" r="1"/>
  </g>
  <!-- KFC text -->
  <text x="32" y="48" fill="white" font-size="10" font-family="Arial" text-anchor="middle" font-weight="bold">KFC</text>
  <!-- Glossy highlight on bucket -->
  <ellipse cx="24" cy="40" rx="4" ry="8" fill="rgba(255,255,255,0.15)"/>
</svg>