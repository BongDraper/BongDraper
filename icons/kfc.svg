<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="kfc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5"/>
      <stop offset="50%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
    <linearGradient id="kfc-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.7)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="kfc-glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Bucket shape -->
  <path d="M10 18 L14 40 L34 40 L38 18 Q24 14 10 18Z" fill="url(#kfc-bg)" filter="url(#kfc-glow)"/>
  <!-- Bucket top -->
  <ellipse cx="24" cy="18" rx="14" ry="4" fill="url(#kfc-bg)"/>
  <!-- Shine -->
  <path d="M12 20 Q18 16 24 18 Q20 22 14 24Z" fill="url(#kfc-shine)" opacity="0.5"/>
  <!-- Stripes -->
  <path d="M16 22 L18 36" stroke="white" stroke-width="2" opacity="0.6"/>
  <path d="M24 20 L24 36" stroke="white" stroke-width="2" opacity="0.6"/>
  <path d="M32 22 L30 36" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Chicken drumstick poking out -->
  <ellipse cx="20" cy="12" rx="4" ry="6" fill="#f5d0a9" transform="rotate(-20 20 12)"/>
  <ellipse cx="28" cy="10" rx="3" ry="5" fill="#f5d0a9" transform="rotate(15 28 10)"/>
  <!-- Sparkles -->
  <circle cx="40" cy="14" r="2" fill="white" opacity="0.9"/>
  <circle cx="8" cy="32" r="1.5" fill="white" opacity="0.7"/>
</svg>