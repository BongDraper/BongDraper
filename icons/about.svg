<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="about-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.5)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="8" fill="url(#about-bg)"/>
  <rect x="4" y="4" width="40" height="20" rx="8" fill="url(#about-shine)"/>
  <!-- Person silhouette -->
  <circle cx="24" cy="16" r="6" fill="white"/>
  <ellipse cx="24" cy="34" rx="10" ry="8" fill="white"/>
</svg>