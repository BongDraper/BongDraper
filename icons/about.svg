<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="aboutBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6"/>
      <stop offset="30%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="aboutSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCC80"/>
      <stop offset="100%" style="stop-color:#FFB74D"/>
    </linearGradient>
    <linearGradient id="aboutShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7E57C2"/>
      <stop offset="100%" style="stop-color:#512DA8"/>
    </linearGradient>
    <filter id="aboutShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Card background -->
  <rect x="6" y="6" width="52" height="52" rx="8" fill="url(#aboutBlue)" filter="url(#aboutShadow)"/>
  <!-- Glossy top -->
  <rect x="8" y="8" width="48" height="20" rx="6" fill="rgba(255,255,255,0.3)"/>
  <!-- Person silhouette -->
  <!-- Head -->
  <circle cx="32" cy="24" r="10" fill="url(#aboutSkin)"/>
  <!-- Hair -->
  <path d="M22 22 Q22 14 32 14 Q42 14 42 22 Q40 18 32 18 Q24 18 22 22" fill="#5D4037"/>
  <!-- Eyes -->
  <ellipse cx="28" cy="24" rx="2" ry="2.5" fill="#333"/>
  <ellipse cx="36" cy="24" rx="2" ry="2.5" fill="#333"/>
  <circle cx="27" cy="23" r="0.8" fill="white"/>
  <circle cx="35" cy="23" r="0.8" fill="white"/>
  <!-- Smile -->
  <path d="M28 29 Q32 33 36 29" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body/Shirt -->
  <path d="M18 58 L18 44 Q18 36 32 36 Q46 36 46 44 L46 58" fill="url(#aboutShirt)"/>
  <!-- Collar -->
  <path d="M28 36 L32 42 L36 36" fill="none" stroke="white" stroke-width="2"/>
  <!-- Shirt highlight -->
  <ellipse cx="26" cy="46" rx="4" ry="8" fill="rgba(255,255,255,0.15)"/>
</svg>