<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="heinekenGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="30%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>
    <linearGradient id="heinekenGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.3)"/>
    </linearGradient>
    <filter id="heinekenShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Bottle shape -->
  <path d="M24 10 L24 6 L40 6 L40 10 L38 14 L38 20 L42 28 L42 56 Q42 60 38 60 L26 60 Q22 60 22 56 L22 28 L26 20 L26 14 Z" fill="url(#heinekenGreen)" filter="url(#heinekenShadow)"/>
  <!-- Glass reflection -->
  <path d="M26 14 L26 20 L22 28 L22 56 Q22 58 24 59 L24 28 L28 20 L28 14 Z" fill="url(#heinekenGlass)"/>
  <!-- Cap -->
  <rect x="24" y="4" width="16" height="4" rx="1" fill="#B8860B"/>
  <rect x="25" y="5" width="14" height="2" rx="0.5" fill="#DAA520"/>
  <!-- Label -->
  <rect x="24" y="34" width="16" height="16" rx="1" fill="white"/>
  <rect x="25" y="35" width="14" height="14" rx="0.5" fill="#1B5E20"/>
  <!-- Star on label -->
  <polygon points="32,38 33.5,42 38,42.5 34.5,45 35.5,50 32,47 28.5,50 29.5,45 26,42.5 30.5,42" fill="#C62828"/>
  <!-- Glossy highlight -->
  <ellipse cx="30" cy="22" rx="4" ry="8" fill="rgba(255,255,255,0.2)"/>
</svg>