<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9af5"/>
      <stop offset="50%" style="stop-color:#e91e8c"/>
      <stop offset="100%" style="stop-color:#ff6b9d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.7)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Blob shape -->
  <path d="M8 16 Q4 24 8 32 Q12 40 24 42 Q36 40 40 32 Q44 24 40 16 Q36 6 24 6 Q12 6 8 16Z" fill="url(#bg)" filter="url(#glow)"/>
  <path d="M10 18 Q8 24 12 28 Q16 32 24 32 Q28 28 28 22 Q28 14 24 12 Q16 10 10 18Z" fill="url(#shine)"/>
  <!-- T icon -->
  <text x="24" y="30" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold" style="text-shadow: 0 2px 4px rgba(0,0,0,0.3)">T</text>
  <!-- Sparkle -->
  <circle cx="36" cy="12" r="2" fill="white" opacity="0.9"/>
  <circle cx="38" cy="14" r="1" fill="white" opacity="0.6"/>
</svg>