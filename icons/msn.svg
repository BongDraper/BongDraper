<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="msnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5BC0EB"/>
      <stop offset="50%" style="stop-color:#2E86AB"/>
      <stop offset="100%" style="stop-color:#1A5276"/>
    </linearGradient>
    <linearGradient id="msnGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7DCE82"/>
      <stop offset="50%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <linearGradient id="msnOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347"/>
      <stop offset="50%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
    <linearGradient id="msnRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7F7F"/>
      <stop offset="50%" style="stop-color:#E53935"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    <filter id="msnShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Butterfly wings -->
  <g filter="url(#msnShadow)">
    <!-- Top left wing -->
    <ellipse cx="20" cy="22" rx="14" ry="16" fill="url(#msnGreen)" transform="rotate(-20 20 22)"/>
    <ellipse cx="18" cy="18" rx="6" ry="8" fill="rgba(255,255,255,0.4)" transform="rotate(-20 18 18)"/>
    <!-- Top right wing -->
    <ellipse cx="44" cy="22" rx="14" ry="16" fill="url(#msnBlue)" transform="rotate(20 44 22)"/>
    <ellipse cx="46" cy="18" rx="6" ry="8" fill="rgba(255,255,255,0.4)" transform="rotate(20 46 18)"/>
    <!-- Bottom left wing -->
    <ellipse cx="18" cy="44" rx="12" ry="14" fill="url(#msnOrange)" transform="rotate(15 18 44)"/>
    <ellipse cx="16" cy="42" rx="5" ry="6" fill="rgba(255,255,255,0.3)" transform="rotate(15 16 42)"/>
    <!-- Bottom right wing -->
    <ellipse cx="46" cy="44" rx="12" ry="14" fill="url(#msnRed)" transform="rotate(-15 46 44)"/>
    <ellipse cx="48" cy="42" rx="5" ry="6" fill="rgba(255,255,255,0.3)" transform="rotate(-15 48 42)"/>
  </g>
  <!-- Body -->
  <ellipse cx="32" cy="36" rx="4" ry="16" fill="#333"/>
  <ellipse cx="32" cy="32" rx="2.5" ry="8" fill="#555"/>
  <!-- Head -->
  <circle cx="32" cy="16" r="5" fill="#333"/>
  <circle cx="32" cy="15" r="2" fill="#555"/>
  <!-- Antennae -->
  <path d="M30 12 Q26 6 22 4" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M34 12 Q38 6 42 4" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <circle cx="22" cy="4" r="2" fill="#333"/>
  <circle cx="42" cy="4" r="2" fill="#333"/>
</svg>