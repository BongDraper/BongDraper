<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Gaudelli | Associate Creative Director</title>
    <meta name="description" content="Portfolio of Max Gaudelli, Associate Creative Director at Dentsu Creative. A haiku writer and a good friend with good music.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Mac OS X Menu Bar -->
    <div class="menubar">
        <div class="menubar-left">
            <span class="apple-menu"></span>
            <span class="menu-item app-name">Finder</span>
            <span class="menu-item">File</span>
            <span class="menu-item">Edit</span>
            <span class="menu-item">View</span>
            <span class="menu-item">Go</span>
            <span class="menu-item">Window</span>
            <span class="menu-item">Help</span>
        </div>
        <div class="menubar-right">
            <span id="menubar-time"></span>
        </div>
    </div>

    <div class="desktop" id="desktop">
        <!-- Desktop Icons - Dynamically loaded from content.json -->
        <div class="desktop-icons" id="desktop-icons">
            <!-- Icons will be loaded dynamically -->
        </div>

        <!-- Windows Container -->
        <div class="windows-container" id="windows-container"></div>

        <!-- Mac OS X Dock - Real Mac OS icons -->
        <div class="dock-container" id="dock-container">
            <div class="dock" id="dock">
                <!-- Finder -->
                <div class="dock-item" data-project="about">
                    <div class="dock-icon">
                        <img src="https://icons.iconarchive.com/icons/johanchalibert/mac-osx-yosemite/256/finder-icon.png" alt="About">
                    </div>
                    <span class="dock-tooltip">About Me</span>
                </div>

                <!-- Safari -->
                <div class="dock-item" data-project="contact">
                    <div class="dock-icon">
                        <img src="https://icons.iconarchive.com/icons/johanchalibert/mac-osx-yosemite/256/safari-icon.png" alt="Contact">
                    </div>
                    <span class="dock-tooltip">Contact</span>
                </div>

                <!-- Music -->
                <div class="dock-item" data-project="music">
                    <div class="dock-icon">
                        <img src="https://icons.iconarchive.com/icons/johanchalibert/mac-osx-yosemite/256/facetime-icon.png" alt="Music">
                    </div>
                    <span class="dock-tooltip">Music Player</span>
                </div>

                <div class="dock-separator"></div>

                <!-- Open Windows will be added here dynamically -->
                <div id="dock-windows"></div>

                <div class="dock-separator" id="dock-separator-end" style="display: none;"></div>

                <!-- iChat / Messages for LinkedIn -->
                <div class="dock-item" data-action="linkedin">
                    <div class="dock-icon">
                        <img src="https://icons.iconarchive.com/icons/johanchalibert/mac-osx-yosemite/256/messages-icon.png" alt="LinkedIn">
                    </div>
                    <span class="dock-tooltip">LinkedIn</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Window Template (hidden) -->
    <template id="window-template">
        <div class="vista-window">
            <div class="window-titlebar">
                <div class="window-icon"></div>
                <span class="window-title"></span>
                <div class="window-controls">
                    <button class="window-btn minimize-btn" title="Minimize">
                        <span></span>
                    </button>
                    <button class="window-btn maximize-btn" title="Maximize">
                        <span></span>
                    </button>
                    <button class="window-btn close-btn" title="Close">
                        <span></span>
                    </button>
                </div>
            </div>
            <div class="window-content"></div>
        </div>
    </template>

    <script src="projects.js"></script>
    <script src="visualizer.js"></script>
    <script src="script.js"></script>
</body>
</html>
