<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Gaudelli | Associate Creative Director</title>
    <meta name="description" content="Portfolio of Max Gaudelli, Associate Creative Director at Dentsu Creative. A haiku writer and a good friend with good music.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Mac OS X Menu Bar -->
    <div class="menubar">
        <div class="menubar-left">
            <span class="apple-menu"></span>
            <span class="menu-item app-name">Finder</span>
            <span class="menu-item">File</span>
            <span class="menu-item">Edit</span>
            <span class="menu-item">View</span>
            <span class="menu-item">Go</span>
            <span class="menu-item">Window</span>
            <span class="menu-item">Help</span>
        </div>
        <div class="menubar-right">
            <span id="menubar-time"></span>
        </div>
    </div>

    <div class="desktop" id="desktop">
        <!-- Desktop Icons - Mac OS X style -->
        <div class="desktop-icons" id="desktop-icons">
            <!-- Projects with Mac-style folder icons -->
            <div class="desktop-icon" data-project="tmobile">
                <div class="icon-image">
                    <img src="https://img.icons8.com/color/96/mac-folder.png" alt="T-Mobile Copa '24">
                </div>
                <span class="icon-label">T-Mobile Copa '24</span>
            </div>

            <div class="desktop-icon" data-project="samsung">
                <div class="icon-image">
                    <img src="https://img.icons8.com/color/96/mac-folder.png" alt="Samsung Galaxy S24">
                </div>
                <span class="icon-label">Samsung Galaxy S24</span>
            </div>

            <div class="desktop-icon" data-project="shibuya">
                <div class="icon-image">
                    <img src="https://img.icons8.com/color/96/mac-folder.png" alt="Virtual Shibuya">
                </div>
                <span class="icon-label">Virtual Shibuya</span>
            </div>

            <div class="desktop-icon" data-project="heineken">
                <div class="icon-image">
                    <img src="https://img.icons8.com/color/96/mac-folder.png" alt="Heineken">
                </div>
                <span class="icon-label">Heineken</span>
            </div>

            <div class="desktop-icon" data-project="audi">
                <div class="icon-image">
                    <img src="https://img.icons8.com/color/96/mac-folder.png" alt="Audi">
                </div>
                <span class="icon-label">Audi</span>
            </div>

            <div class="desktop-icon" data-project="kfc">
                <div class="icon-image">
                    <img src="https://img.icons8.com/color/96/mac-folder.png" alt="KFC">
                </div>
                <span class="icon-label">KFC</span>
            </div>

            <!-- App icons -->
            <div class="desktop-icon" data-project="about">
                <div class="icon-image">
                    <img src="https://img.icons8.com/color/96/contacts.png" alt="About Me">
                </div>
                <span class="icon-label">About Me</span>
            </div>

            <div class="desktop-icon" data-project="contact">
                <div class="icon-image">
                    <img src="https://img.icons8.com/color/96/apple-mail.png" alt="Contact">
                </div>
                <span class="icon-label">Contact</span>
            </div>

            <div class="desktop-icon" data-project="music">
                <div class="icon-image">
                    <img src="https://img.icons8.com/color/96/itunes.png" alt="Music Player">
                </div>
                <span class="icon-label">Music Player</span>
            </div>
        </div>

        <!-- Windows Container -->
        <div class="windows-container" id="windows-container"></div>

        <!-- Mac OS X Dock -->
        <div class="dock-container" id="dock-container">
            <div class="dock" id="dock">
                <!-- Finder -->
                <div class="dock-item" data-project="about">
                    <div class="dock-icon">
                        <img src="https://img.icons8.com/color/96/mac-os.png" alt="About">
                    </div>
                    <span class="dock-tooltip">About Me</span>
                </div>

                <!-- Safari -->
                <div class="dock-item" data-project="contact">
                    <div class="dock-icon">
                        <img src="https://img.icons8.com/color/96/safari--v1.png" alt="Contact">
                    </div>
                    <span class="dock-tooltip">Contact</span>
                </div>

                <!-- iTunes -->
                <div class="dock-item" data-project="music">
                    <div class="dock-icon">
                        <img src="https://img.icons8.com/color/96/itunes.png" alt="Music">
                    </div>
                    <span class="dock-tooltip">Music Player</span>
                </div>

                <div class="dock-separator"></div>

                <!-- Open Windows will be added here dynamically -->
                <div id="dock-windows"></div>

                <div class="dock-separator" id="dock-separator-end" style="display: none;"></div>

                <!-- iChat / Messages for LinkedIn -->
                <div class="dock-item" data-action="linkedin">
                    <div class="dock-icon">
                        <img src="https://img.icons8.com/color/96/imessage.png" alt="LinkedIn">
                    </div>
                    <span class="dock-tooltip">LinkedIn</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Window Template (hidden) -->
    <template id="window-template">
        <div class="vista-window">
            <div class="window-titlebar">
                <div class="window-icon"></div>
                <span class="window-title"></span>
                <div class="window-controls">
                    <button class="window-btn minimize-btn" title="Minimize">
                        <span></span>
                    </button>
                    <button class="window-btn maximize-btn" title="Maximize">
                        <span></span>
                    </button>
                    <button class="window-btn close-btn" title="Close">
                        <span></span>
                    </button>
                </div>
            </div>
            <div class="window-content"></div>
        </div>
    </template>

    <script src="projects.js"></script>
    <script src="visualizer.js"></script>
    <script src="script.js"></script>
</body>
</html>
