<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Gaudelli | Associate Creative Director</title>
    <meta name="description" content="Portfolio of Max Gaudelli, Associate Creative Director at Dentsu Creative. A haiku writer and a good friend with good music.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

        <!-- Desktop Icons -->

                </div>
                <span class="icon-label">T-Mobile Copa '24</span>
            </div>

            <div class="desktop-icon" data-project="samsung">
                <div class="icon-image">
                    <img src="https://img.icons8.com/fluency/96/samsung.png" alt="Samsung Galaxy S24" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2220%22 fill=%22%231428a0%22/%3E%3Ctext x=%2224%22 y=%2232%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2218%22 font-weight=%22bold%22%3ES%3C/text%3E%3C/svg%3E'">
                </div>
                <span class="icon-label">Samsung Galaxy S24</span>
            </div>

            <div class="desktop-icon" data-project="shibuya">
                <div class="icon-image">
                    <img src="https://img.icons8.com/fluency/96/city-buildings.png" alt="Virtual Shibuya" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2220%22 fill=%22%23ff69b4%22/%3E%3Ctext x=%2224%22 y=%2232%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2220%22 font-weight=%22bold%22%3E渋%3C/text%3E%3C/svg%3E'">
                </div>
                <span class="icon-label">Virtual Shibuya</span>
            </div>

            <div class="desktop-icon" data-project="heineken">
                <div class="icon-image">
                    <img src="https://img.icons8.com/fluency/96/heineken.png" alt="Heineken" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2220%22 fill=%22%23008200%22/%3E%3Ctext x=%2224%22 y=%2232%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2220%22 font-weight=%22bold%22%3EH%3C/text%3E%3C/svg%3E'">
                </div>
                <span class="icon-label">Heineken</span>
            </div>

            <div class="desktop-icon" data-project="audi">
                <div class="icon-image">
                    <img src="https://img.icons8.com/fluency/96/audi.png" alt="Audi" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2220%22 fill=%22%23bb0a30%22/%3E%3Ctext x=%2224%22 y=%2232%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2220%22 font-weight=%22bold%22%3EA%3C/text%3E%3C/svg%3E'">
                </div>
                <span class="icon-label">Audi</span>
            </div>

            <div class="desktop-icon" data-project="kfc">
                <div class="icon-image">
                    <img src="https://img.icons8.com/fluency/96/kfc.png" alt="KFC" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2220%22 fill=%22%23e4002b%22/%3E%3Ctext x=%2224%22 y=%2232%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2218%22 font-weight=%22bold%22%3EKFC%3C/text%3E%3C/svg%3E'">
                </div>
                <span class="icon-label">KFC</span>
            </div>

            <div class="desktop-icon" data-project="about">
                <div class="icon-image">
                    <img src="https://img.icons8.com/fluency/96/user-male-circle.png" alt="About Me" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2220%22 fill=%22%234a90e2%22/%3E%3Ccircle cx=%2224%22 cy=%2220%22 r=%226%22 fill=%22white%22/%3E%3Cpath d=%22M24 28c-4 0-7 2-7 4v4h14v-4c0-2-3-4-7-4z%22 fill=%22white%22/%3E%3C/svg%3E'">
                </div>
                <span class="icon-label">About Me</span>
            </div>

            <div class="desktop-icon" data-project="contact">
                <div class="icon-image">
                    <img src="https://img.icons8.com/fluency/96/email-open.png" alt="Contact" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2220%22 fill=%22%2350c878%22/%3E%3Cpath d=%22M14 18h20v12H14z%22 fill=%22white%22/%3E%3Cpath d=%22M14 18l10 8 10-8%22 fill=%22none%22 stroke=%22%2350c878%22 stroke-width=%222%22/%3E%3C/svg%3E'">
                </div>
                <span class="icon-label">Contact</span>
            </div>

            <div class="desktop-icon" data-project="music">
                <div class="icon-image">
                    <img src="https://img.icons8.com/fluency/96/music.png" alt="Music Player" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2220%22 fill=%22%239b59b6%22/%3E%3Cpath d=%22M18 30c0 2 1.3 3 3 3s3-1 3-3V18h4v12c0 2 1.3 3 3 3s3-1 3-3V14h-10v16z%22 fill=%22white%22/%3E%3C/svg%3E'">
                </div>
                <span class="icon-label">Music Player</span>
            </div>
        </div>

        <!-- Windows Container -->
        <div class="windows-container" id="windows-container"></div>

        <!-- Taskbar -->
        <div class="taskbar">
            <button class="start-button" id="start-button">
                <div class="start-orb"></div>
            </button>

            <div class="taskbar-programs" id="taskbar-programs"></div>

            <div class="system-tray">
                <span class="tray-time" id="tray-time"></span>
            </div>
        </div>

        <!-- Start Menu -->
        <div class="start-menu" id="start-menu">
            <div class="start-menu-header">
                <div class="user-avatar"></div>
                <span class="user-name">Max Gaudelli</span>
            </div>
            <div class="start-menu-content">
                <div class="start-menu-left">
                    <div class="start-item" data-project="about">
                        <div class="start-item-icon about-icon"></div>
                        <span>About Me</span>
                    </div>
                    <div class="start-item" data-project="contact">
                        <div class="start-item-icon contact-icon"></div>
                        <span>Contact</span>
                    </div>
                    <div class="start-separator"></div>
                    <div class="start-item" data-project="music">
                        <div class="start-item-icon music-icon"></div>
                        <span>Music Player</span>
                    </div>
                    <div class="start-separator"></div>
                    <div class="start-item" data-action="linkedin">
                        <div class="start-item-icon linkedin-icon"></div>
                        <span>LinkedIn</span>
                    </div>
                </div>
                <div class="start-menu-right">
                    <div class="start-item-small" data-project="tmobile">T-Mobile Copa '24</div>
                    <div class="start-item-small" data-project="samsung">Samsung Galaxy S24</div>
                    <div class="start-item-small" data-project="shibuya">Virtual Shibuya</div>
                    <div class="start-item-small" data-project="heineken">Heineken</div>
                    <div class="start-item-small" data-project="audi">Audi</div>
                    <div class="start-item-small" data-project="kfc">KFC</div>
                </div>
            </div>
            <div class="start-menu-footer">
                <div class="start-footer-item" data-action="shutdown">
                    <span>Shut Down</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Window Template (hidden) -->
    <template id="window-template">
        <div class="vista-window">
            <div class="window-titlebar">
                <div class="window-icon"></div>
                <span class="window-title"></span>
                <div class="window-controls">
                    <button class="window-btn minimize-btn" title="Minimize">
                        <span></span>
                    </button>
                    <button class="window-btn maximize-btn" title="Maximize">
                        <span></span>
                    </button>
                    <button class="window-btn close-btn" title="Close">
                        <span></span>
                    </button>
                </div>
            </div>
            <div class="window-content"></div>
        </div>
    </template>

    <script src="projects.js"></script>
    <script src="visualizer.js"></script>
    <script src="script.js"></script>
</body>
</html>
